<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mia APES Hub">
<title>Mia's APES Unit 3 Master Portal (V1 + V2 + V3)</title>
<style>
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; height: 100%; background: #070b14; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: #f8fafc; overflow: hidden; display: flex; flex-direction: column; }
  .topbar {
    background: #0f172a; border-bottom: 1px solid #334155; padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .brand { font-weight: 800; font-size: 14.5px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
  .v-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .vbtn {
    background: #1e293b; border: 1px solid #475569; color: #e2e8f0;
    padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .vbtn.active {
    background: linear-gradient(135deg, #10b981, #0284c7); border-color: #38bdf8; color: #fff;
  }
  iframe { flex: 1; width: 100%; border: none; background: #0b1120; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">🌿 Mia's APES Master Portal (Unit 3)</div>
    <div class="v-pills">
      <button class="vbtn active" onclick="loadVer(4, this)">⭐ V4: Fixed Videos + Smart Brain Dump + Graphs + Teach Mom</button>
      <button class="vbtn" onclick="loadVer(2, this)">💡 V2: "LAX" Wordplay Blur Deck + 20-Q Quiz</button>
      <button class="vbtn" onclick="loadVer(1, this)">📊 V1: 6 Visual Infographics + Packet Key</button>
    </div>
  </div>
  <iframe id="viewer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  <script>
    const files = { 4: "v4.html", 2: "v2.html", 1: "v1.html" };
    function loadVer(n, btn) {
      document.querySelectorAll(".vbtn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      document.getElementById("viewer").src = files[n] + "?v=20261119";
    }
    loadVer(4, document.querySelector(".vbtn.active"));
  </script>
</body>
</html>
